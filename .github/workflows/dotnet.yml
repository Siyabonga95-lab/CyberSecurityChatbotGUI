# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore CyberSecurityChatbotGUI/CyberSecurityChatbotGUI.csproj

    - name: Build
      run: dotnet build CyberSecurityChatbotGUI/CyberSecurityChatbotGUI.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test CyberSecurityChatbotGUI/CyberSecurityChatbotGUI.csproj --configuration Release --no-build --verbosity normal

    # Make sure this path correctly matches where your project outputs binaries
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: chatbot-release
        path: CyberSecurityChatbotGUI/bin/Release/
