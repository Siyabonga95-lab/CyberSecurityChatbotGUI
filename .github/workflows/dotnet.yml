name: .NET Framework CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # This creates the local \packages\ folder that SQLite is looking for
    - name: Restore NuGet packages
      run: nuget restore CyberSecurityChatbotGUI/CyberSecurityChatbotGUI.csproj

    # This properly resolves the .targets file and builds the legacy project
    - name: Build
      run: msbuild CyberSecurityChatbotGUI/CyberSecurityChatbotGUI.csproj /p:Configuration=Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: chatbot-release
        path: CyberSecurityChatbotGUI/bin/Release/
